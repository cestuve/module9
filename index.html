.static-lens-card .card-icon,.static-stage-card .card-icon,.takeaway-icon{display:block;font-size:30px;line-height:1;margin-bottom:6px}.static-lens-card strong,.static-stage-card strong{display:block;color:var(--navy);font-size:17px;margin-bottom:4px}.static-lens-card p,.static-stage-card p{font-size:13px!important;line-height:1.45!important;color:#55768c!important;font-weight:700!important;margin:6px 0!important}.static-stage-card .detail-note,.static-lens-card .case-note,.static-stage-card .listen-note{margin-top:8px!important;padding-top:8px;border-top:1px solid rgba(46,74,93,.12)}
.takeaway-icon{font-size:32px}
.video-fallback{font-size:13px;color:#55768c;font-weight:700;margin-top:8px}
.takeaway-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.takeaway-card{border-radius:18px;padding:15px;border:3px solid rgba(46,74,93,.12);background:#fff7e9;display:grid;grid-template-columns:58px minmax(0,1fr);column-gap:12px;align-items:center}.takeaway-card:nth-child(2){background:#eef5f4}.takeaway-card:nth-child(3){background:#fff3e7}.takeaway-card:nth-child(4){background:#eef2f7}.takeaway-card .takeaway-icon{font-size:44px;line-height:1;margin:0;text-align:center}.takeaway-card strong{display:block;font-size:17px;margin:0;line-height:1.2}.takeaway-card>span:not(.takeaway-icon){grid-column:1/-1;margin-top:10px;font-size:13px;line-height:1.45;color:#55768c;font-weight:700}
.m9-final-card{position:absolute;z-index:10;top:110px;left:50%;transform:translateX(-50%);width:min(760px,88vw);background:rgba(255,253,247,.96);border:5px solid rgba(215,167,74,.86);border-radius:28px;padding:26px;text-align:center;box-shadow:var(--shadow)}.m9-final-card h2{font-size:clamp(30px,4vw,48px);margin:0 0 9px}.m9-final-card p{font-size:17px;color:#496173;line-height:1.5}
@media(max-width:1050px){.stage-card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.client-folder-grid{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.lens-grid,.stage-card-grid,.client-folder-grid,.takeaway-grid{grid-template-columns:1fr}.model-row,.challenge-row{grid-template-columns:1fr}.stage-flow{grid-template-columns:1fr}.cycle-arrow{transform:rotate(90deg)}}
</style>
</head>
<body>

<a class="sr-only" href="#mainContent">Skip to course content</a>
<div class="app" id="app">
<header class="hud hidden" id="courseHud" aria-label="Course menu"><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false">Menu ▾</button><div class="menu hidden" id="sceneMenu" aria-hidden="true"></div></header>
<main id="mainContent"></main>
<div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal" id="modalPanel"><button class="close-btn" id="closeModal" aria-label="Close dialog">×</button><div id="modalContent"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="sr-only" id="srStatus" aria-live="polite"></div>
</div>

<script>

(() => {
'use strict';
const IMG={
 exterior:'https://cestuve.github.io/module1/BG-01.png',
 finalExterior:'https://cestuve.github.io/module1/BG-08.png',
 office:'https://cestuve.github.io/module2/Maria_Office.png',
 training:'https://cestuve.github.io/module9/Staff_Training_Room.png',
 consultation:'https://cestuve.github.io/module9/Client_Consultation_Room.png',
 meeting:'https://cestuve.github.io/module9/Community_Meeting_Room.png',
 mariaFull:'https://cestuve.github.io/module9/Maria_Fullbody.png',
 mariaHead:'https://cestuve.github.io/module9/Maria_Headshot.png',
 danielFull:'https://cestuve.github.io/module9/Daniel_Fullbody.png',
 danielHead:'https://cestuve.github.io/module9/Daniel_Headshot.png',
 derekFull:'https://cestuve.github.io/module9/Derek_Fullbody.png',
 derekHead:'https://cestuve.github.io/module9/Derek_Headshot.png',
 felicia:'https://cestuve.github.io/module9/Felicia_Headshot.png',
 heather:'https://cestuve.github.io/module9/Heather_Headshot.png',
 omarFull:'https://cestuve.github.io/module9/Omar_Fullbody.png',
 omarHead:'https://cestuve.github.io/module9/Omar_Headshot.png',
 isaiah:'https://cestuve.github.io/module9/Isaiah_Headshot.png',
 gloriaFull:'https://cestuve.github.io/module9/Gloria_Fullbody.png',
 gloriaHead:'https://cestuve.github.io/module9/Gloria_Headshot.png'
};
const sections=[
 ['Welcome','Return to Harbor Point & meet Daniel'],
 ['Theories of Addiction','Explore Derek through four lenses'],
 ['Stages of Change','Recognize readiness for change'],
 ['Stage Detective','Practice with several clients'],
 ['Ambivalence','Match your response to readiness'],
 ['Change Over Time','Maintenance, setbacks, & re-entry'],
 ['Harbor Point Challenge','Integrate stage + response'],
 ['Complete','Debrief with Maria']
];
const state={maxSection:0,lenses:new Set(),stages:new Set(),huddle:new Set(),reflections:{causes:'',changeStage:'',ambivalence:'',support:''}};
const main=document.getElementById('mainContent'),hud=document.getElementById('courseHud'),menu=document.getElementById('sceneMenu'),menuToggle=document.getElementById('menuToggle'),modalBackdrop=document.getElementById('modalBackdrop'),modalContent=document.getElementById('modalContent'),closeModalBtn=document.getElementById('closeModal'),toast=document.getElementById('toast'),srStatus=document.getElementById('srStatus');
function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function say(t){srStatus.textContent='';setTimeout(()=>srStatus.textContent=t,20)}
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
function showModal(html){const wasHidden=modalBackdrop.classList.contains('hidden');modalContent.innerHTML=html;modalBackdrop.classList.remove('hidden');modalBackdrop.setAttribute('aria-hidden','false');const p=document.getElementById('modalPanel');if(p)p.scrollTop=0;if(wasHidden)setTimeout(()=>closeModalBtn.focus(),20)}
function closeModal(){modalBackdrop.classList.add('hidden');modalBackdrop.setAttribute('aria-hidden','true')}
closeModalBtn.addEventListener('click',closeModal);modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modalBackdrop.classList.contains('hidden'))closeModal()});
function setSection(i){state.maxSection=Math.max(state.maxSection,i);renderMenu()}
function renderMenu(){menu.innerHTML=sections.map((s,i)=>`<button class="menu-item" type="button" data-jump="${i}">${i+1}. ${s[0]}<span>${s[1]}</span></button>`).join('')}
menuToggle.addEventListener('click',e=>{e.stopPropagation();menu.classList.toggle('hidden');const hidden=menu.classList.contains('hidden');menuToggle.setAttribute('aria-expanded',hidden?'false':'true');menu.setAttribute('aria-hidden',hidden?'true':'false')});document.addEventListener('click',e=>{if(!e.target.closest('#courseHud')){menu.classList.add('hidden');menuToggle.setAttribute('aria-expanded','false');menu.setAttribute('aria-hidden','true')}});
function headQuote(img,name,copy){return `<div class="quote-card quote-with-headshot"><img src="${img}" alt="${esc(name)}"><div><strong>${esc(name)}</strong><p>${copy}</p></div></div>`}
function choiceMarkup(action,opts){return `<div class="question-block"><div class="choices">${opts.map((o,i)=>`<button class="choice-btn" type="button" data-question-answer="true" data-action="${action}" data-v="${i}"><span class="choice-title">${String.fromCharCode(65+i)}.</span><span class="choice-text">${o}</span></button>`).join('')}</div><div class="inline-question-feedback" aria-live="polite"></div></div>`}
function feedback(button,ok,title,body,nextAction,nextLabel){const block=button.closest('.question-block')||button.closest('.check-question-block');const box=block?block.querySelector('.inline-question-feedback'):null;if(!box)return;box.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');box.innerHTML=`<strong>${title}</strong>${body}${ok&&nextAction?`<div class="button-row"><button class="primary-btn" type="button" data-action="${nextAction}">${nextLabel}</button></div>`:''}`;say(`${title}. ${box.textContent||''}`)}
function markChoice(button,correctIndex){const v=Number(button.dataset.v),ok=v===correctIndex;if(ok){[...button.parentElement.querySelectorAll('.choice-btn')].forEach((x,j)=>{x.disabled=true;if(j===correctIndex)x.classList.add('correct')})}else{button.classList.add('incorrect')}return ok}
function titleIntro(){main.innerHTML=`<section class="intro-scene"><div class="intro-panel"><span class="mini-label">Harbor Point · Module 9</span><h1>Understanding Addiction &amp; Readiness for Change</h1><div class="intro-rule"></div><p class="intro-lead">Understanding addiction requires looking beyond a single cause and recognizing the biological, psychological, social, and environmental factors that can influence substance use and recovery.</p><p class="intro-copy">This week, you’ll return to Harbor Point to explore different theories of addiction and learn how the Stages of Change model can help explain why clients may differ in their readiness to make a change.</p><p class="intro-copy">You’ll also practice recognizing precontemplation, contemplation, preparation, action, and maintenance, identifying ambivalence, and choosing person-centered responses that match a client’s current readiness for change within the CDCA role.</p><div class="button-row"><button class="primary-btn" data-action="go-exterior">Return to Harbor Point →</button></div></div></section>`}
function exterior(){hud.classList.remove('hidden');setSection(0);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.exterior}')"><div class="scene-title-card" style="top:110px;left:7%;text-align:left"><span class="mini-label">Module 9 · Back at Harbor Point</span><h1>Harbor Point Recovery Services</h1><p>Maria asked you to stop by her office. She wants to introduce you to another member of the Harbor Point team who will be training you today.</p></div><button class="hotspot" type="button" aria-label="Enter Harbor Point" data-action="maria-scene" style="left:52%;top:34%;width:18%;height:36%"></button></div></section>`}
function mariaScene(){closeModal();setSection(0);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.office}')"><div class="scene-guide">Meet with Maria before today’s training begins.</div><img class="character" src="${IMG.mariaFull}" alt="" style="left:50%;transform:translateX(-50%);bottom:-2%;height:70vh"><button class="character-hotspot" data-action="maria-intro" type="button" aria-label="Talk with Maria" style="left:50%;transform:translateX(-50%);bottom:2%;width:30%;height:64%"></button></div></section>`}
function mariaIntro(){showModal(`<h2>A New Harbor Point Colleague</h2><p>Maria explains that today you’ll work with another staff member who spends a lot of time helping clients explore change, especially when they are not sure whether they are ready to make it.</p>${headQuote(IMG.mariaHead,'Maria','“You’ve worked with me quite a bit over the past several weeks, but Harbor Point is a team effort. I want you to meet Daniel. He’ll guide you through how addiction can be understood in different ways and why recognizing readiness for change matters so much in client care.”')}<div class="button-row center"><button class="primary-btn" data-action="daniel-scene">Meet Daniel →</button></div>`) }
function danielScene(){closeModal();setSection(0);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.training}')"><div class="scene-guide">Meet Daniel.</div><img class="character" src="${IMG.danielFull}" alt="" style="left:50%;transform:translateX(-50%);bottom:-3%;height:70vh"><button class="character-hotspot" data-action="daniel-intro" type="button" aria-label="Meet Daniel" style="left:50%;transform:translateX(-50%);bottom:2%;width:31%;height:64%"></button></div></section>`}
function danielIntro(){showModal(`<h2>Meet Daniel</h2>${headQuote(IMG.danielHead,'Daniel','“This week, we’re going to look at two important questions: How do we understand addiction? And how can we recognize whether someone is ready for change?”')}<p>Daniel explains that two clients can experience similar consequences and still need very different conversations.</p><div class="teaching-card"><h3>What You’ll Practice Today</h3><div class="info-grid"><div class="info-card"><strong>1. Differentiate</strong><span>Differentiate major theories of addiction based on how each explains factors that contribute to substance use and substance use disorders.</span></div><div class="info-card"><strong>2. Identify</strong><span>Identify a client’s likely stage of change based on statements, behaviors, readiness, and ambivalence.</span></div><div class="info-card"><strong>3. Select</strong><span>Select stage-appropriate, person-centered strategies to support movement toward change within the CDCA role.</span></div></div></div><div class="callout"><strong>Daniel’s reminder:</strong> Pay attention to what each client actually says and does, not what you think the client <em>should</em> be ready to do.</div><div class="button-row center"><button class="primary-btn" data-action="first-instinct">Start With a First Instinct Check →</button></div>`) }
function firstInstinct(){showModal(`<h2>One Behavior, Many Influences</h2><p>Before you meet a client, Daniel asks you to consider how substance use disorders can develop.</p><h3>Which statement is most accurate?</h3>${choiceMarkup('first-instinct-choice',['There must be one primary cause if the assessment is thorough enough.','The cause is usually determined by which substance the person uses.','Substance use disorders occur primarily when people repeatedly make poor choices.','Substance use disorders can develop through interacting biological, psychological, behavioral, and social influences.'])}`)}
function derekScene(){closeModal();setSection(1);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.consultation}')"><div class="scene-guide">Derek came to Harbor Point to get help with alcohol use. Let’s learn how different theories can shape what we notice.</div><img class="character" src="${IMG.derekFull}" alt="" style="left:50%;transform:translateX(-50%);bottom:-3%;height:69vh"><button class="character-hotspot" data-action="meet-derek" type="button" aria-label="Meet Derek" style="left:50%;transform:translateX(-50%);bottom:2%;width:29%;height:63%"></button></div></section>`}
function meetDerek(){showModal(`<h2>Meet Derek</h2><div class="client-hero"><img src="${IMG.derekHead}" alt="Derek"><div><h3>Derek · Age 42</h3><p>Derek works full time as a warehouse shift supervisor. He has been drinking regularly for years, and his alcohol use has increased over the past two years.</p><div class="quote-card">“My wife thinks I drink too much. Maybe she’s right that it’s gotten worse. My dad drank a lot, too. After work, a bunch of us usually stop somewhere for drinks. Lately I’ve been having a couple more at home, especially when I can’t sleep or I’ve had a bad day.”</div></div></div><div class="assessment-folder-grid"><div class="assessment-folder"><strong>Family history</strong><span>Derek’s father experienced significant alcohol-related problems.</span></div><div class="assessment-folder"><strong>Body & brain</strong><span>Derek reports needing more alcohol than he once did to feel the same effects.</span></div><div class="assessment-folder"><strong>Coping patterns</strong><span>Alcohol has become connected to stress relief and sleep.</span></div><div class="assessment-folder"><strong>Social context</strong><span>Coworkers regularly meet for drinks after their shifts.</span></div><div class="assessment-folder"><strong>Life stress</strong><span>Derek reports financial and family stress.</span></div><div class="assessment-folder"><strong>Stigma</strong><span>He worries that seeking treatment would make him look weak.</span></div></div><div class="button-row center"><button class="primary-btn" data-action="lenses">Look Through Four Lenses →</button></div>`)}
function lenses(){const cards=[['🧬','Biological Model','Looks at genetics, inherited vulnerability, brain reward systems, neurochemical processes, physiological responses, and changes that can occur with repeated substance exposure.','A biological lens might pay particular attention to Derek’s family history and what repeated alcohol exposure may be doing in his body and brain. Biological vulnerability does not mean addiction is predetermined.'],['🧠','Psychological Model','Examines thoughts, emotions, learning, coping patterns, reinforcement, beliefs, behavior, and mental health concerns.','Derek tells us that alcohol has become connected to stress relief and sleep. A psychological lens would want to understand those learned and coping-related patterns.'],['🌎','Sociocultural Model','Considers family and peer norms, relationships, culture, stigma, socioeconomic conditions, community environment, availability, and access to treatment and support.','Derek’s drinking does not happen in isolation. Coworkers, family stress, finances, social expectations, and beliefs about asking for help may all matter.'],['⚖️','Moral Model','Historically interpreted addiction mainly as a problem of character, morality, weakness, or poor choices.','This model is important to understand historically, but contemporary addiction science does not support reducing substance use disorders to moral weakness. Blame and stigma can interfere with compassionate, evidence-based care.']];showModal(`<h2>Four Lenses for Understanding Addiction</h2><p>The goal is not to pick a single “winning” explanation but to notice what each lens emphasizes.</p><div class="lens-grid">${cards.map(c=>`<div class="static-lens-card"><span class="card-icon" aria-hidden="true">${c[0]}</span><strong>${c[1]}</strong><p>${c[2]}</p><p class="case-note"><strong>In Derek’s case:</strong> ${c[3]}</p></div>`).join('')}</div><div class="button-row center"><button class="primary-btn" data-action="lens-match">Apply the Lenses →</button></div>`) }
function lensMatch(){showModal(`<h2>Apply the Lenses</h2><div class="check-question-block"><p>Match each detail from Derek’s story to the lens most likely to emphasize it.</p><div class="model-match"><div class="model-row"><strong>“If I need treatment, that means I should’ve had more self-control.”</strong><select data-lens-answer="Moral-model thinking"><option value="">Choose…</option><option>Biological</option><option>Psychological</option><option>Sociocultural</option><option>Moral-model thinking</option></select></div><div class="model-row"><strong>“Drinking is the fastest way for me to shut my brain off after a bad day.”</strong><select data-lens-answer="Psychological"><option value="">Choose…</option><option>Biological</option><option>Psychological</option><option>Sociocultural</option><option>Moral-model thinking</option></select></div><div class="model-row"><strong>“Everyone from my shift goes out for drinks after work.”</strong><select data-lens-answer="Sociocultural"><option value="">Choose…</option><option>Biological</option><option>Psychological</option><option>Sociocultural</option><option>Moral-model thinking</option></select></div><div class="model-row"><strong>“My dad had serious problems with alcohol, too.”</strong><select data-lens-answer="Biological"><option value="">Choose…</option><option>Biological</option><option>Psychological</option><option>Sociocultural</option><option>Moral-model thinking</option></select></div></div><div class="button-row center"><button class="primary-btn" data-action="check-lens-match">Check My Thinking →</button></div><div class="inline-question-feedback" aria-live="polite"></div></div>`) }
function wholePerson(){showModal(`<h2>Which Theory Wins?</h2><p>Daniel asks you to step back from the individual details.</p><h3>Which response best reflects what you have learned?</h3>${choiceMarkup('whole-person-choice',['The biological model explains Derek because his father also had alcohol-related problems.','The psychological model explains Derek because he drinks when stressed.','The sociocultural model explains Derek because coworkers normalize drinking.','Derek’s situation may involve influences identified by several models rather than one explanation alone.'])}`)}
function reflection1(){showModal(`<h2>Seeing More Than One Cause</h2><div class="field"><label for="rCauses"><strong>Think about a behavior, habit, or reaction from your own life that would be misleading to explain with just one cause. What different factors were influencing you at the time (e.g., stress, sleep, relationships, environment, routines, expectations, or physical factors)? How does that experience help explain why a counselor should avoid assuming there is one simple reason for a client’s substance use?</strong></label><textarea id="rCauses" placeholder="Write your response here.">${esc(state.reflections.causes)}</textarea></div><div class="button-row center"><button class="primary-btn" data-action="save-r1">Save Response + Continue →</button></div>`)}
function reflection2(){showModal(`<h2>Recognizing Change in Your Own Life</h2><div class="field"><label for="rChangeStage"><strong>Think about a behavior or habit you have tried to change. You may choose an everyday example such as exercise, studying, sleep, spending, screen time, organization, or another behavior you are comfortable discussing. Choose one point in that process. Which Stage of Change best describes where you were at that time? What were you saying, thinking, or doing that makes you place yourself in that stage?</strong></label><textarea id="rChangeStage" placeholder="Write your response here.">${esc(state.reflections.changeStage)}</textarea></div><div class="button-row center"><button class="primary-btn" data-action="save-r2">Save Response + Continue →</button></div>`)}
function reflection3(){showModal(`<h2>Understanding Ambivalence</h2><div class="field"><label for="rAmbivalence"><strong>Think of a time when you wanted to make a change but also had a real reason for staying the same. What pulled you toward change? What pulled you toward staying the same? How does that experience help you understand why a client in Contemplation may sound inconsistent without necessarily being unwilling or unmotivated?</strong></label><textarea id="rAmbivalence" placeholder="Write your response here.">${esc(state.reflections.ambivalence)}</textarea></div><div class="button-row center"><button class="primary-btn" data-action="save-r3">Save Response + Continue →</button></div>`)}
function stagesScene(){closeModal();setSection(2);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.training}')"><div class="scene-guide">Daniel wants to shift from “Why might this be happening?” to “What is this person ready to do?”</div><img class="character" src="${IMG.danielFull}" alt="" style="left:50%;transform:translateX(-50%);bottom:-3%;height:70vh"><button class="character-hotspot" data-action="stages-intro" type="button" aria-label="Learn about the Stages of Change with Daniel" style="left:50%;transform:translateX(-50%);bottom:2%;width:31%;height:64%"></button></div></section>`}
function stagesIntro(){showModal(`<h2>From “Why?” to “What Now?”</h2>${headQuote(IMG.danielHead,'Daniel','“Even when a person is experiencing serious consequences, that doesn’t mean the person is ready to change today.”')}<div class="teaching-card"><p><strong>Client A:</strong> “I don’t have a problem.”</p><p><strong>Client B:</strong> “I know this isn’t working anymore, but I don’t know if I’m ready to stop.”</p><p><strong>Client C:</strong> “I called two treatment programs yesterday.”</p><p><strong>Client D:</strong> “I’ve been in treatment for three weeks, and I’m working on my recovery plan.”</p></div><p><strong>Same general issue. Very different readiness.</strong> The Stages of Change model describes behavior change as a process rather than a single decision.</p><div class="stage-flow"><div>Precontemplation</div><div>Contemplation</div><div>Preparation</div><div>Action</div><div>Maintenance</div></div><div class="callout">Behavior change isn’t constant linear motion—it is a process. People can move forward, move backward, remain in one stage for a long time, and show different readiness for different behaviors.</div><div class="button-row center"><button class="primary-btn" data-action="stage-cards">Explore the Five Stages →</button></div>`) }
function stageCards(){const cards=[['🌱','Precontemplation','Not currently considering change','The person may not recognize a problem, may see few reasons to change, may feel discouraged, or may be participating because someone else wants them there.','“I don’t think this is really a problem.”'],['💭','Contemplation','Considering change but not committed to action','The person sees reasons to change and reasons not to. Ambivalence is often strongest here.','“Part of me wants to stop. Part of me doesn’t.”'],['🗓️','Preparation','Intends to act soon and begins getting ready','The person may research options, make appointments, tell others about plans, set goals, identify barriers, or take small initial steps.','“I decided I need to do something. I called Harbor Point yesterday.”'],['🚶','Action','Actively making the change','The person may participate in treatment, change routines, practice coping skills, seek support, and address triggers and barriers.','“I started treatment and I’m working on my plan.”'],['🧭','Maintenance','Working to sustain changes already made','The focus may include recovery-supportive routines, anticipating triggers, using coping strategies, strengthening supports, and preparing for setbacks.','“I know what works, and I keep doing it.”']];showModal(`<h2>Listen for Readiness</h2><p>Review what each stage can look and sound like.</p><div class="stage-card-grid">${cards.map(c=>`<div class="static-stage-card"><span class="card-icon" aria-hidden="true">${c[0]}</span><strong>${c[1]}</strong><p>${c[2]}</p><p class="detail-note">${c[3]}</p><p class="listen-note"><strong>Listen for:</strong> ${c[4]}</p></div>`).join('')}</div><div class="button-row center"><button class="primary-btn" data-action="video">Watch the Video →</button></div>`) }
function video(){showModal(`<h2>Stages of Change in Everyday Life</h2><p>Watch this 8-minute explanation of the <strong>Transtheoretical Model (Stages of Change)</strong>. This is one of the most important concepts we will cover in this course because it provides a practical way to understand how people move through the process of behavior change.</p><p>The model is widely used across healthcare, behavioral health, and helping professions. Understanding it can help you recognize where a client is in the change process and choose support strategies that are appropriate for that stage. No matter what area of practice you enter, this is a framework you are likely to encounter and use when working with clients.</p><div class="m9-video"><iframe src="https://www.youtube.com/embed/VVyhhMzWkiU?rel=0" title="Transtheoretical Model and Stages of Change examples" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><p class="video-fallback">If your browser or network blocks the embedded player, <a class="resource-link" href="https://www.youtube.com/watch?v=VVyhhMzWkiU" target="_blank" rel="noopener">open the video on YouTube</a>.</p><div class="button-row center"><button class="primary-btn" data-action="reflection-2">Continue →</button></div>`) }

function changeCycle(){showModal(`<h2>Change Isn’t Constant Linear Motion</h2>${headQuote(IMG.danielHead,'Daniel','“A setback does not erase everything that came before it.”')}<div class="cycle-visual" aria-label="Change can move among stages"><span class="cycle-node">Precontemplation</span><span class="cycle-arrow">→</span><span class="cycle-node">Contemplation</span><span class="cycle-arrow">→</span><span class="cycle-node">Preparation</span><span class="cycle-arrow">→</span><span class="cycle-node">Action</span><span class="cycle-arrow">→</span><span class="cycle-node">Maintenance</span><span class="cycle-arrow">↺</span></div><p>Real change can move forward and backward. A return to substance use does not automatically place someone back at the beginning.</p><div class="callout"><strong>Another complication:</strong> A person can also be in different stages for different behaviors.</div><p>A client says: “I stopped drinking three months ago, and I’m following my recovery plan. But I smoke cigarettes every day, and I’m not interested in quitting those.”</p><h3>Which interpretation is strongest?</h3>${choiceMarkup('different-behavior-choice',['The client is in Action for every health behavior.','The client is in Precontemplation for every health behavior.','The stages cannot be used when more than one substance is involved.','The client may be in Action regarding alcohol and Precontemplation regarding smoking.'])}`)}

function keyTakeaways(){showModal(`<h2>Put It Together</h2>${headQuote(IMG.danielHead,'Daniel','“Think back to Derek. His story reminded us that substance use doesn’t exist in a vacuum. And even after we understand possible influences, we still have to ask: What is this person ready to do right now?”')}<div class="takeaway-grid"><div class="takeaway-card"><span class="takeaway-icon" aria-hidden="true">🧩</span><strong>Understanding Addiction</strong><span>Addiction is complex and should not be reduced to one simple cause. Biological, psychological, and sociocultural perspectives highlight different influences.</span></div><div class="takeaway-card"><span class="takeaway-icon" aria-hidden="true">⚖️</span><strong>Historical Moral Model</strong><span>The moral model is important to understand historically, but contemporary evidence does not support treating addiction as simply a moral failing. Stigma can interfere with help-seeking and care.</span></div><div class="takeaway-card"><span class="takeaway-icon" aria-hidden="true">🔄</span><strong>Understanding Change</strong><span>Precontemplation, Contemplation, Preparation, Action, and Maintenance describe readiness related to a specific behavior. Change is not necessarily linear.</span></div><div class="takeaway-card"><span class="takeaway-icon" aria-hidden="true">🤝</span><strong>CDCA Connection</strong><span>Your role is not to force change. Listen, recognize readiness, support appropriate next steps, maintain scope, and work with the treatment team.</span></div></div><details class="source-drawer"><summary>Additional Resources (optional)</summary><p>These links are available if you want to explore further.</p><ul><li><a class="resource-link" href="https://thedecisionlab.com/reference-guide/psychology/the-transtheoretical-model-ttm" target="_blank" rel="noopener">The Decision Lab — Transtheoretical Model</a></li><li><a class="resource-link" href="https://kmb.camh.ca/ggtu/knowledge-translation/stages-of-change" target="_blank" rel="noopener">CAMH — Stages of Change</a></li><li><a class="resource-link" href="https://www.ncbi.nlm.nih.gov/books/NBK556005/" target="_blank" rel="noopener">NCBI Bookshelf — Stages of Change Theory</a></li><li><a class="resource-link" href="https://www.camh.ca/en/professionals/treating-conditions-and-disorders/fundamentals-of-addiction/f-of-addiction---motivation-and-change" target="_blank" rel="noopener">CAMH — Motivation and Change</a></li><li><a class="resource-link" href="https://www.relias.com/blog/stages-of-change-addiction" target="_blank" rel="noopener">Relias — Stages of Change and Addiction</a></li><li><a class="resource-link" href="https://ecampusontario.pressbooks.pub/centennialfundamentalsofaddictiontraumainformedmotivationalinterviewingcasemanagement/chapter/gender-stigma-and-substance-use/" target="_blank" rel="noopener">Centennial College Pressbooks — The Stages of Change</a></li><li><a class="resource-link" href="https://www.relias.com/wp-content/uploads/2024/06/24-HHS-BH-6106-StagesOfChange-Infographic_v2.pdf" target="_blank" rel="noopener">Relias — Stages of Change Workbook</a></li></ul></details><div class="button-row center"><button class="primary-btn" data-action="maria-debrief-scene">Meet With Maria →</button></div>`) }
