<title>Example Video + Quiz Module</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;650;750;800;900&display=swap');
:root{

}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;font-family:'Inter',Arial,sans-serif;background:var(--cream);color:var(--navy)}
body{overflow:hidden}button,input,textarea,a{font:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.app{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--cream)}
.hidden{display:none!important}.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.intro-scene{position:absolute;inset:0;z-index:70;display:grid;place-items:center;padding:34px 20px;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.8) 0 8%,transparent 8.3%),radial-gradient(circle at 88% 78%,rgba(110,144,151,.14) 0 14%,transparent 14.3%),linear-gradient(135deg,#faf6ef 0%,#f4e8d6 56%,#e7d3b4 100%);overflow:auto}
.intro-panel{width:min(980px,94vw);background:rgba(255,253,250,.97);border:6px solid rgba(215,167,74,.62);border-radius:34px;box-shadow:var(--shadow);padding:clamp(28px,4.6vw,54px);text-align:left;position:relative;overflow:hidden;margin:auto}
.intro-panel h1{margin:0;color:var(--navy);font-size:clamp(38px,5.4vw,68px);line-height:1;letter-spacing:-.045em}.intro-panel h2{font-size:clamp(31px,4vw,48px);margin:0;color:var(--navy)}
.intro-lead{margin:18px 0 0;color:#3b5869;font-size:clamp(18px,1.8vw,23px);line-height:1.55;font-weight:750}.intro-copy{margin:15px 0 0;color:#496173;font-size:clamp(16px,1.45vw,19px);line-height:1.6;font-weight:650}
.intro-rule{width:88px;height:7px;border-radius:999px;background:linear-gradient(90deg,var(--clay),var(--gold));margin:18px 0 0}.mini-label{display:inline-flex;align-items:center;gap:7px;background:#f2e1c3;border:1px solid rgba(46,74,93,.12);color:#6d5422;font-weight:900;padding:8px 15px;border-radius:999px;margin-bottom:10px;letter-spacing:.03em;text-transform:uppercase;font-size:12px}
.primary-btn,.secondary-btn,.small-btn,.choice-btn,.card-btn,.object-btn{border:0;cursor:pointer}.primary-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(to bottom,var(--clay),var(--clay-dark));color:white;font-weight:900;border-radius:999px;padding:14px 24px;box-shadow:0 12px 22px rgba(183,91,63,.28);text-decoration:none;transition:.18s ease}.primary-btn:hover{transform:translateY(-2px)}
.secondary-btn{display:inline-flex;align-items:center;justify-content:center;background:#eef5f4;color:var(--deep);font-weight:900;border-radius:999px;padding:12px 18px;border:2px solid rgba(46,74,93,.12);text-decoration:none}.small-btn{background:#f1e3ca;color:var(--navy);font-weight:900;border-radius:999px;padding:9px 13px}.button-row{display:flex;flex-wrap:wrap;gap:11px;align-items:center;margin-top:18px}.button-row.center{justify-content:center}
.hud{position:fixed;top:18px;right:18px;z-index:55}.menu-toggle{border:3px solid rgba(215,167,74,.62);cursor:pointer;background:rgba(255,253,247,.96);color:var(--navy);font-weight:900;border-radius:999px;padding:10px 16px;box-shadow:var(--small-shadow)}.menu{position:absolute;top:48px;right:0;width:330px;background:rgba(255,253,247,.99);border:3px solid rgba(217,164,65,.62);border-radius:20px;box-shadow:var(--shadow);padding:10px;display:grid;gap:7px}.menu-item{width:100%;border:2px solid rgba(46,74,93,.12);border-radius:14px;background:#fff7e9;color:var(--navy);padding:10px 12px;text-align:left;cursor:pointer;font-weight:900;line-height:1.2}.menu-item span{display:block;margin-top:3px;color:#55768c;font-size:12px;font-weight:800}.menu-item[disabled]{cursor:not-allowed;opacity:.46}
.scene{position:absolute;inset:0}.environment{position:absolute;inset:0;background-size:cover;background-position:center;overflow:hidden}.environment::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,40,55,.02),rgba(20,40,55,.12));pointer-events:none}
.scene-guide{position:absolute;z-index:13;top:92px;left:50%;transform:translateX(-50%);background:rgba(255,253,247,.96);border:4px solid rgba(217,164,65,.68);border-radius:22px;padding:14px 21px;box-shadow:var(--small-shadow);font-size:clamp(20px,2vw,29px);line-height:1.22;font-weight:900;color:var(--navy);text-align:center;max-width:min(960px,90vw)}
.scene-title-card{position:absolute;z-index:4;background:rgba(255,253,247,.95);border:5px solid rgba(215,167,74,.86);border-radius:26px;box-shadow:var(--shadow);padding:20px 24px;max-width:min(730px,88vw)}.scene-title-card h1,.scene-title-card h2{margin:0;color:var(--navy);letter-spacing:-.03em}.scene-title-card h1{font-size:clamp(36px,5vw,66px);line-height:.98}.scene-title-card h2{font-size:clamp(28px,3.5vw,46px)}.scene-title-card p{margin:10px 0 0;color:#496173;font-size:clamp(16px,1.7vw,21px);line-height:1.4;font-weight:700}
.character{position:absolute;z-index:6;pointer-events:none;filter:drop-shadow(0 18px 22px rgba(29,48,62,.22));object-fit:contain}.character-hotspot,.hotspot{position:absolute;z-index:10;border:0;background:transparent;cursor:pointer;border-radius:34px}.character-hotspot::after,.hotspot::after{content:"";position:absolute;inset:-7px;border:4px solid rgba(255,255,255,.84);border-radius:34px;box-shadow:0 0 0 5px rgba(215,167,74,.55);animation:pulse 1.4s ease-in-out infinite alternate}@keyframes pulse{from{transform:scale(.985);opacity:.7}to{transform:scale(1.02);opacity:1}}
.modal-backdrop{position:fixed;inset:0;display:grid;place-items:center;background:rgba(30,52,67,.56);z-index:90;padding:20px}.modal{width:min(940px,96vw);max-height:min(88vh,820px);overflow:auto;background:var(--paper);border-radius:30px;border:6px solid rgba(217,164,65,.76);box-shadow:0 28px 80px rgba(0,0,0,.3);padding:27px;position:relative}.modal h2{margin:0 0 10px;font-size:clamp(29px,3.8vw,46px);line-height:1.04;letter-spacing:-.035em;color:var(--navy)}.modal h3{margin:19px 0 8px;color:var(--deep);font-size:22px}.modal p,.modal li{font-size:16px;line-height:1.55;color:#3b5869}.close-btn{position:sticky;top:0;float:right;margin-top:-9px;margin-right:-9px;width:44px;height:44px;border-radius:50%;border:0;background:#f1e3ca;color:var(--navy);font-weight:900;cursor:pointer;z-index:5}
.quote-card{margin:15px 0;background:#eef5f4;border-left:8px solid #6d9c9d;border-radius:18px;padding:17px 19px;color:#314f61;font-weight:800;line-height:1.48;font-size:18px}.quote-with-headshot{display:grid;grid-template-columns:82px 1fr;gap:16px;align-items:center}.quote-with-headshot img{width:82px;height:82px;object-fit:cover;border-radius:50%;border:4px solid #fff;box-shadow:0 8px 18px rgba(36,55,70,.18)}.quote-with-headshot strong{display:block;margin-bottom:5px;color:var(--navy);font-size:15px}.quote-with-headshot p{margin:0}
.teaching-card,.feedback-card,.profile-card{margin:15px 0;border-radius:22px;padding:18px}.teaching-card{background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,247,233,.78)),#f7eddc;border:3px solid rgba(217,164,65,.48);box-shadow:var(--small-shadow)}.feedback-card{position:static!important;inset:auto!important;transform:none!important;float:none!important;background:#eef5f4;border-left:8px solid var(--blue)}.feedback-card.correct{background:#eef7f1;border-left-color:#56886d}.feedback-card.incorrect{background:#fff1ef;border-left-color:#bd6e64}[data-feedback]{position:static!important;display:block!important;width:100%!important;margin-top:14px!important;inset:auto!important;transform:none!important;float:none!important}[data-feedback].has-feedback{padding:16px 18px!important;border-radius:16px!important;box-shadow:none!important}[data-feedback].correct{background:#eef7f1!important;border:2px solid #b9d9c4!important;border-left:8px solid #56886d!important}[data-feedback].incorrect{background:#fff1ef!important;border:2px solid #e3b6b1!important;border-left:8px solid #bd6e64!important}[data-feedback].has-feedback strong{display:block;margin-bottom:6px;color:var(--navy)}[data-feedback].has-feedback p{margin:6px 0 0}[data-feedback].has-feedback .button-row{margin-top:14px}.profile-card{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;background:#fff7e9;border:3px solid rgba(217,164,65,.42)}.profile-card img{width:100%;height:175px;object-fit:contain}.compact-profile{grid-template-columns:95px 1fr}.compact-profile img{width:95px;height:95px;object-fit:cover;border-radius:50%;background:#fff;border:4px solid white}
.question-block{display:block;width:100%}.inline-question-feedback{display:block;width:100%;margin-top:14px;position:static!important;inset:auto!important;transform:none!important;float:none!important}.inline-question-feedback.has-feedback{padding:16px 18px;border-radius:16px;background:#eef5f4;border:2px solid #c7d8dc;border-left:8px solid var(--blue);box-shadow:none}.inline-question-feedback.correct{background:#eef7f1;border-color:#b9d9c4;border-left-color:#56886d}.inline-question-feedback.incorrect{background:#fff1ef;border-color:#e3b6b1;border-left-color:#bd6e64}.inline-question-feedback strong{display:block;margin-bottom:6px;color:var(--navy)}.inline-question-feedback p{margin:6px 0 0;color:#3b5869}.inline-question-feedback .button-row{margin-top:14px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:15px 0}.choice-btn,.card-btn{background:#f4e9d6;color:var(--deep);border:3px solid rgba(46,74,93,.14);border-radius:18px;padding:16px;text-align:left;min-height:92px;box-shadow:0 8px 16px rgba(30,52,67,.08);transition:.18s ease}.choice-btn:hover,.choice-btn.selected,.card-btn:hover,.card-btn.selected{transform:translateY(-2px);background:#fffdf7;border-color:var(--gold)}.choice-btn.correct{background:#edf7ef;border-color:#7fb492}.choice-btn.incorrect{background:#fff1f0;border-color:#d58c86}.choice-title{display:block;font-size:17px;font-weight:900;margin-bottom:5px;color:var(--navy)}.choice-text{display:block;line-height:1.4;color:#4a6473;font-size:14px;font-weight:700}
.info-grid,.tile-grid,.service-grid,.match-grid,.resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.info-card,.tile,.service-card,.resource-card{background:#fff7e9;border:3px solid rgba(46,74,93,.13);border-radius:18px;padding:15px;color:var(--navy)}.info-card strong,.tile strong,.service-card strong,.resource-card strong{display:block;font-size:17px;margin-bottom:5px}.info-card span,.tile span,.service-card span,.resource-card span{display:block;font-size:13px;line-height:1.4;color:#55768c;font-weight:700}.icon-title{display:flex!important;align-items:center;gap:9px}.icon{font-size:26px;line-height:1}
.game-board{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.target{min-height:160px;border:3px dashed #8aa3ad;border-radius:20px;padding:14px;background:#f7fbfa}.target h3{margin-top:0}.draggable-list{display:grid;gap:9px}.drag-card{border:2px solid rgba(46,74,93,.16);background:#fff7e9;border-radius:15px;padding:12px 13px;font-weight:850;color:var(--navy);cursor:pointer}.drag-card.selected{border-color:var(--gold);box-shadow:0 0 0 3px rgba(215,167,74,.18)}.target .drag-card{margin:7px 0;background:white}
.progress{height:10px;background:#eadbc6;border-radius:999px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:linear-gradient(90deg,var(--clay),var(--gold));width:0%;transition:.3s ease}.step-pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#eef5f4;color:var(--deep);font-weight:900;font-size:12px}.small{font-size:13px!important}.muted{color:#667b88!important}.center{text-align:center}.left{text-align:left}.callout{padding:14px 16px;border-radius:16px;background:#fff3d9;border-left:7px solid var(--gold);font-weight:750;color:#5a4a24}.divider{height:1px;background:#e3d8c9;margin:18px 0}
.field label{display:block;font-weight:900;color:var(--navy);margin-bottom:7px}.field textarea,.field input{width:100%;border:3px solid rgba(46,74,93,.16);border-radius:18px;padding:13px 14px;color:var(--navy);background:#fffefa;line-height:1.45}.field textarea{min-height:145px;resize:vertical}.graded-note{margin-top:10px;padding:10px 12px;border-radius:13px;background:#eef5f4;color:#355467;font-size:13px;font-weight:850}
.phone{width:min(440px,100%);margin:16px auto;border:10px solid #243746;border-radius:34px;background:#f5f7f8;padding:16px;box-shadow:var(--small-shadow)}.phone-top{text-align:center;font-size:12px;font-weight:900;color:#607784;margin-bottom:12px}.bubble{max-width:84%;padding:11px 13px;border-radius:18px;margin:9px 0;line-height:1.4;font-size:14px;font-weight:700}.bubble.client{background:#e6ebef;color:#2f4a5a}.bubble.you{background:#d9efe7;color:#254a3b;margin-left:auto}.chat-options{display:grid;gap:8px;margin-top:14px}.chat-option{border:2px solid #c8d3d9;background:white;border-radius:15px;padding:11px;text-align:left;cursor:pointer;color:#2e5061;font-weight:800}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.tab-btn{border:2px solid rgba(46,74,93,.16);background:#f3eadb;color:var(--navy);border-radius:999px;padding:9px 12px;font-weight:900;cursor:pointer}.tab-btn.active{background:var(--deep);color:white}.tab-panel{display:none}.tab-panel.active{display:block}.asam-wheel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.asam-seg{border:3px solid rgba(46,74,93,.15);border-radius:18px;background:#eef5f4;padding:14px;text-align:center;cursor:pointer;font-weight:900;color:var(--deep)}.asam-seg.open{border-color:var(--gold);background:#fff7e9}.lock{font-size:70px;text-align:center;margin:10px}.unlock{animation:pop .5s ease}@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.flip-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.flip-card{border:3px solid rgba(46,74,93,.14);border-radius:20px;background:#fff7e9;padding:19px;min-height:145px;cursor:pointer;text-align:left}.flip-card.revealed{background:#eef5f4;border-color:#8db4b1}.flip-card .back{display:none}.flip-card.revealed .front{display:none}.flip-card.revealed .back{display:block}
.review-item{background:#fff7e9;border:2px solid rgba(46,74,93,.12);border-radius:18px;padding:15px;margin:11px 0}.review-item h3{margin:0 0 8px}.review-item textarea{width:100%;min-height:110px;border:2px solid rgba(46,74,93,.14);border-radius:14px;padding:11px;background:#fff}
.resource-link{color:#245f78;font-weight:900;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:120;background:rgba(30,52,67,.95);color:white;border-radius:999px;padding:13px 18px;font-weight:900;box-shadow:var(--small-shadow);transition:.25s ease;text-align:center;max-width:min(700px,calc(100vw - 32px))}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.medication-groups{display:grid;gap:16px;margin:16px 0}.med-group{border-radius:22px;padding:17px 18px;border:3px solid rgba(46,74,93,.13);box-shadow:0 8px 18px rgba(36,55,70,.08)}.med-group.oud{background:#eef5f4;border-color:#9dc9c3}.med-group.aud{background:#fff3e7;border-color:#e7b08c}.med-group h3{margin:0 0 12px}.med-static-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.med-static{background:rgba(255,255,255,.8);border:2px solid rgba(46,74,93,.12);border-radius:16px;padding:13px}.med-static strong{display:block;color:var(--navy);margin-bottom:4px}.med-static span{display:block;color:#55768c;font-size:13px;line-height:1.42;font-weight:700}.med-both{grid-column:span 1}
.peer-match-table{display:grid;gap:10px;margin:14px 0}.peer-match-row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(220px,.8fr);gap:12px;align-items:center;border:2px solid rgba(46,74,93,.12);border-radius:16px;background:#fff7e9;padding:12px}.peer-match-row strong{line-height:1.4}.peer-select{width:100%;border:2px solid rgba(46,74,93,.18);border-radius:12px;padding:10px;background:#fff;color:var(--navy);font-weight:750}.match-ok{border-color:#7fb492;background:#eef7f1}.match-no{border-color:#d58c86;background:#fff1f0}
.support-spectrum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:16px 0}.support-group{border-radius:20px;padding:16px;border:3px solid rgba(46,74,93,.12)}.support-group:nth-child(1){background:#eef5f4;border-color:#9dc9c3}.support-group:nth-child(2){background:#fff3e7;border-color:#e7b08c}.support-group:nth-child(3){background:#f3f1e8;border-color:#bdc49e}.support-group h3{margin:0 0 10px}.support-item{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;padding:8px 0;border-top:1px solid rgba(46,74,93,.1)}.support-item:first-of-type{border-top:0}.support-item .sicon{font-size:24px}.support-item strong{display:block;font-size:14px}.support-item span{font-size:12px;color:#55768c;line-height:1.35;font-weight:700}.service-reminder{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 16px}.service-chip{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;background:#eef5f4;border:1px solid rgba(46,74,93,.16);font-size:12px;font-weight:850;color:var(--deep)}
.sector-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}.sector-card{padding:14px 10px;border-radius:17px;text-align:center;border:2px solid rgba(46,74,93,.12);background:#fff7e9}.sector-card:nth-child(4n+2){background:#eef5f4}.sector-card:nth-child(4n+3){background:#f7efe8}.sector-card:nth-child(4n+4){background:#eef2f7}.sector-card .sector-icon{display:block;font-size:30px;margin-bottom:6px}.sector-card strong{font-size:14px}

.static-lens-card .card-icon,.static-stage-card .card-icon,.takeaway-icon{display:block;font-size:30px;line-height:1;margin-bottom:6px}.static-lens-card strong,.static-stage-card strong{display:block;color:var(--navy);font-size:17px;margin-bottom:4px}.static-lens-card p,.static-stage-card p{font-size:13px!important;line-height:1.45!important;color:#55768c!important;font-weight:700!important;margin:6px 0!important}.static-stage-card .detail-note,.static-lens-card .case-note,.static-stage-card .listen-note{margin-top:8px!important;padding-top:8px;border-top:1px solid rgba(46,74,93,.12)}
.takeaway-icon{font-size:32px}
.video-fallback{font-size:13px;color:#55768c;font-weight:700;margin-top:8px}
.takeaway-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.takeaway-card{border-radius:18px;padding:15px;border:3px solid rgba(46,74,93,.12);background:#fff7e9;display:grid;grid-template-columns:58px minmax(0,1fr);column-gap:12px;align-items:center}.takeaway-card:nth-child(2){background:#eef5f4}.takeaway-card:nth-child(3){background:#fff3e7}.takeaway-card:nth-child(4){background:#eef2f7}.takeaway-card .takeaway-icon{font-size:44px;line-height:1;margin:0;text-align:center}.takeaway-card strong{display:block;font-size:17px;margin:0;line-height:1.2}.takeaway-card>span:not(.takeaway-icon){grid-column:1/-1;margin-top:10px;font-size:13px;line-height:1.45;color:#55768c;font-weight:700}
.m9-final-card{position:absolute;z-index:10;top:110px;left:50%;transform:translateX(-50%);width:min(760px,88vw);background:rgba(255,253,247,.96);border:5px solid rgba(215,167,74,.86);border-radius:28px;padding:26px;text-align:center;box-shadow:var(--shadow)}.m9-final-card h2{font-size:clamp(30px,4vw,48px);margin:0 0 9px}.m9-final-card p{font-size:17px;color:#496173;line-height:1.5}
@media(max-width:1050px){.stage-card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.client-folder-grid{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.lens-grid,.stage-card-grid,.client-folder-grid,.takeaway-grid{grid-template-columns:1fr}.model-row,.challenge-row{grid-template-columns:1fr}.stage-flow{grid-template-columns:1fr}.cycle-arrow{transform:rotate(90deg)}}


/* Example Video + Quiz Module additions */
body{overflow:hidden}
.demo-stage{position:absolute;inset:0;overflow:auto;padding:42px 20px 54px;background:
  radial-gradient(circle at 8% 14%,rgba(255,255,255,.86) 0 7%,transparent 7.3%),
  radial-gradient(circle at 92% 80%,rgba(110,144,151,.13) 0 15%,transparent 15.3%),
  linear-gradient(135deg,#faf6ef 0%,#f5ebdc 58%,#ead9bd 100%)}
.demo-shell{width:min(1040px,94vw);margin:0 auto;background:rgba(255,253,250,.98);border:5px solid rgba(215,167,74,.64);border-radius:30px;box-shadow:var(--shadow);padding:clamp(22px,4vw,42px)}
.demo-header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.demo-header h1{margin:0;color:var(--navy);font-size:clamp(31px,4.7vw,54px);line-height:1.03;letter-spacing:-.04em}.demo-header p{margin:9px 0 0;color:#496173;font-size:16px;line-height:1.55;font-weight:700;max-width:720px}
.demo-badge{display:inline-flex;align-items:center;background:#f2e1c3;border:1px solid rgba(46,74,93,.12);color:#6d5422;font-weight:900;padding:8px 13px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase;font-size:11px;white-space:nowrap}
.progress-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0 25px}.progress-step{position:relative;text-align:center;padding-top:19px;font-size:11px;font-weight:900;color:#78909d}.progress-step:before{content:"";position:absolute;top:0;left:50%;width:13px;height:13px;border-radius:50%;transform:translateX(-50%);background:#d9d2c7;border:3px solid white;box-shadow:0 0 0 2px #d9d2c7}.progress-step:after{content:"";position:absolute;top:5px;left:calc(-50% + 7px);right:calc(50% + 7px);height:3px;background:#d9d2c7}.progress-step:first-child:after{display:none}.progress-step.active,.progress-step.done{color:var(--deep)}.progress-step.active:before,.progress-step.done:before{background:var(--clay);box-shadow:0 0 0 2px var(--gold)}.progress-step.done:after,.progress-step.active:after{background:var(--gold)}
.content-card{background:#fff7e9;border:3px solid rgba(46,74,93,.12);border-radius:23px;padding:clamp(18px,3vw,28px);box-shadow:0 10px 22px rgba(36,55,70,.08)}.content-card h2{margin:0 0 9px;color:var(--navy);font-size:clamp(26px,3.5vw,39px);letter-spacing:-.025em}.content-card>p{color:#4a6473;font-size:16px;line-height:1.55;font-weight:700}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;margin:18px 0;border-radius:20px;overflow:hidden;background:#17252f;border:5px solid #fff;box-shadow:0 14px 28px rgba(36,55,70,.18)}.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.video-note{font-size:12px!important;color:#667b88!important;margin-top:8px!important}.video-note a{color:#245f78;font-weight:900}
.quiz-list{display:grid;gap:16px;margin-top:18px}.quiz-question{border:3px solid rgba(46,74,93,.12);border-radius:19px;background:white;padding:18px}.quiz-question legend{font-size:17px;font-weight:900;color:var(--navy);padding:0 5px;margin-bottom:8px}.quiz-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.quiz-option{display:flex;gap:9px;align-items:flex-start;border:2px solid rgba(46,74,93,.12);border-radius:14px;background:#fffaf1;padding:12px 13px;color:#405d70;font-weight:800;cursor:pointer}.quiz-option:hover{border-color:var(--gold);background:#fffdf8}.quiz-option input{margin-top:3px;accent-color:var(--clay);transform:scale(1.12)}.q-feedback{margin-top:10px;padding:11px 13px;border-radius:13px;font-size:13px;line-height:1.4;font-weight:800;display:none}.q-feedback.show{display:block}.q-feedback.correct{background:#eef7f1;border-left:7px solid #56886d;color:#355467}.q-feedback.incorrect{background:#fff1ef;border-left:7px solid #bd6e64;color:#71443f}.quiz-summary{margin-top:15px;padding:13px 15px;border-radius:15px;background:#eef5f4;color:#355467;font-weight:900;display:none}.quiz-summary.show{display:block}
.welcome-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:17px;margin-top:17px}.welcome-card{border-radius:20px;padding:19px;border:3px solid rgba(46,74,93,.12);background:#eef5f4}.welcome-card:last-child{background:#fff3e7}.welcome-card strong{display:block;color:var(--navy);font-size:18px;margin-bottom:6px}.welcome-card span{display:block;color:#55768c;font-size:14px;line-height:1.45;font-weight:700}.dog-icon{font-size:62px;line-height:1;margin-bottom:8px}.completion-box{text-align:center;padding:25px}.completion-box .big-check{font-size:72px;line-height:1}.completion-box h2{font-size:clamp(30px,4vw,46px);margin:8px 0}.completion-box p{max-width:700px;margin:0 auto 8px;color:#496173;font-weight:700;line-height:1.55}
.nav-row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:20px}.nav-row.right{justify-content:flex-end}.secondary-btn:disabled,.primary-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.tiny-score{font-size:12px;color:#667b88;font-weight:850}
.menu-item.current{background:#eef5f4;border-color:var(--gold)}
@media(max-width:760px){.demo-stage{padding:24px 11px 40px}.demo-shell{width:96vw;border-width:4px;padding:18px}.demo-header{display:block}.demo-badge{margin-top:12px}.quiz-options,.welcome-grid{grid-template-columns:1fr}.progress-step{font-size:9px}.content-card{padding:17px}.video-frame{border-width:3px}.nav-row{flex-wrap:wrap}.nav-row .primary-btn,.nav-row .secondary-btn{width:100%}}
</style>

<body>
<a class="sr-only" href="#mainContent">Skip to course content</a>
<div class="app" id="app">
  <header class="hud" id="courseHud" aria-label="Course menu">
    <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false">Menu ▾</button>
    <div class="menu hidden" id="sceneMenu" aria-hidden="true"></div>
  </header>
  <main id="mainContent" tabindex="-1"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="srStatus" aria-live="polite"></div>
</div>

<script>
(() => {
'use strict';
const sections = [
  ['Welcome','See the example flow'],
  ['Video 1','Embedded YouTube Short'],
  ['Quiz 1','Two funny dog-name questions'],
  ['Video 2','A second embedded video'],
  ['Quiz 2','Two more dog-name questions'],
  ['Complete','Example module finished']
];
const state={current:0,maxSection:0,quiz1Done:false,quiz2Done:false};
const main=document.getElementById('mainContent');
const menu=document.getElementById('sceneMenu');
const menuToggle=document.getElementById('menuToggle');
const toast=document.getElementById('toast');
const srStatus=document.getElementById('srStatus');
function say(t){srStatus.textContent='';setTimeout(()=>srStatus.textContent=t,20)}
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2100)}
function unlock(i){state.maxSection=Math.max(state.maxSection,i);renderMenu()}
function progressMarkup(){
  const labels=['Video 1','Quiz 1','Video 2','Quiz 2','Done'];
  const map=[1,2,3,4,5];
  return `<div class="progress-row" aria-label="Module progress">${labels.map((label,i)=>{
    const sec=map[i];
    const cls=state.current>sec?'done':state.current===sec?'active':'';
    return `<div class="progress-step ${cls}">${label}</div>`
  }).join('')}</div>`
}
function shell(inner,badge='Example Module'){
  return `<section class="demo-stage"><div class="demo-shell"><div class="demo-header"><div><span class="mini-label">Video + Quiz Pattern</span><h1>Example Learning Module</h1><p>A simple demonstration of how an embedded video can be followed by a short knowledge check, then repeated with a second video and quiz.</p></div><span class="demo-badge">${badge}</span></div>${progressMarkup()}${inner}</div></section>`
}
function renderMenu(){
  menu.innerHTML=sections.map((s,i)=>`<button class="menu-item ${i===state.current?'current':''}" type="button" data-jump="${i}" ${i>state.maxSection?'disabled':''}>${i+1}. ${s[0]}<span>${s[1]}</span></button>`).join('');
}
function go(i){
  if(i>state.maxSection)return;
  state.current=i;renderMenu();
  if(i===0)welcome();
  if(i===1)video1();
  if(i===2)quiz1();
  if(i===3)video2();
  if(i===4)quiz2();
  if(i===5)complete();
  main.focus({preventScroll:true});
}
function welcome(){
  main.innerHTML=shell(`<div class="content-card"><h2>What This Example Shows</h2><p>This sample is intentionally short. It lets a learner watch a video, answer two questions, watch a second video, and answer two more questions.</p><div class="welcome-grid"><div class="welcome-card"><div class="dog-icon" aria-hidden="true">🐶</div><strong>Simple learning rhythm</strong><span>Video → Quiz → Video → Quiz. The quizzes provide immediate feedback and keep the learner moving forward.</span></div><div class="welcome-card"><strong>Same visual language</strong><span>Rounded cards, warm colors, bold headings, and pill-style buttons mirror the supplied module template while keeping this demo easy to share.</span></div></div><div class="nav-row right"><button class="primary-btn" type="button" data-action="start">Start Example →</button></div></div>`,'Coworker Preview');
}
function videoCard(num,id,sourceUrl,nextAction,nextLabel){
  return shell(`<div class="content-card"><h2>Video ${num}</h2><p>Watch the embedded video below. When you are ready, continue to the two-question knowledge check.</p><div class="video-frame"><iframe src="https://www.youtube.com/embed/${id}?rel=0" title="Example video ${num}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><p class="video-note">If the embedded player is unavailable in a local preview, <a href="${sourceUrl}" target="_blank" rel="noopener">open the video on YouTube</a>.</p><div class="nav-row"><button class="secondary-btn" type="button" data-action="back">← Back</button><button class="primary-btn" type="button" data-action="${nextAction}">${nextLabel} →</button></div></div>`,'Embedded Video');
}
function video1(){main.innerHTML=videoCard(1,'LHRaPXGx_qw','https://www.youtube.com/shorts/LHRaPXGx_qw','to-quiz1','Continue to Quiz 1')}
function video2(){main.innerHTML=videoCard(2,'-OPh-6jRxjU','https://www.youtube.com/shorts/-OPh-6jRxjU','to-quiz2','Continue to Quiz 2')}
const quizzes={
  q1:[
    {id:'q1a',q:'Which funny dog name is a pun on the author Mark Twain?',options:['Bark Twain','Indiana Bones','Mary Puppins','Chewbarka'],answer:'Bark Twain',why:'“Bark Twain” swaps “Mark” for “Bark,” making it a dog-themed pun on Mark Twain.'},
    {id:'q1b',q:'Which funny dog name is a pun on the composer Wolfgang Amadeus Mozart?',options:['Droolius Caesar','Woofgang Amadeus','Hairy Pawter','Sir Waggington'],answer:'Woofgang Amadeus',why:'“Woofgang Amadeus” turns Wolfgang Amadeus Mozart’s first name into a dog sound.'}
  ],
  q2:[
    {id:'q2a',q:'Which funny dog name is a pun on Harry Potter?',options:['Hairy Pawter','Bark Obama','Pup Tart','Mutt Damon'],answer:'Hairy Pawter',why:'“Hairy Pawter” playfully changes Harry Potter into a dog-themed name.'},
    {id:'q2b',q:'Which funny dog name is a pun on Indiana Jones?',options:['Chewbarka','Indiana Bones','Bark Ruffalo','Snoop Doggy Dog'],answer:'Indiana Bones',why:'“Indiana Bones” replaces “Jones” with “Bones,” a classic dog reference.'}
  ]
};
function questionMarkup(item){
  return `<fieldset class="quiz-question" data-qid="${item.id}"><legend>${item.q}</legend><div class="quiz-options">${item.options.map((o,i)=>`<label class="quiz-option"><input type="radio" name="${item.id}" value="${o.replace(/&/g,'&amp;').replace(/\"/g,'&quot;')}"><span><strong>${String.fromCharCode(65+i)}.</strong> ${o}</span></label>`).join('')}</div><div class="q-feedback" aria-live="polite"></div></fieldset>`
}
function quizPage(which){
  const is1=which===1,items=is1?quizzes.q1:quizzes.q2;
  const done=is1?state.quiz1Done:state.quiz2Done;
  main.innerHTML=shell(`<div class="content-card"><h2>Quiz ${which}: Funny Dog Names</h2><p>Select one answer for each question, then choose <strong>Check Answers</strong>. This is only a playful demo of how a short knowledge check could look.</p><form id="quizForm" data-quiz="${which}"><div class="quiz-list">${items.map(questionMarkup).join('')}</div><div class="quiz-summary ${done?'show':''}" id="quizSummary">${done?'Quiz completed. You can continue.':''}</div><div class="nav-row"><button class="secondary-btn" type="button" data-action="back">← Back</button><div><span class="tiny-score" id="scoreText"></span> <button class="primary-btn" type="submit">Check Answers</button></div></div>${done?`<div class="nav-row right"><button class="primary-btn" type="button" data-action="${is1?'to-video2':'finish'}">${is1?'Continue to Video 2':'Finish Example'} →</button></div>`:''}</form></div>`,'2-Question Quiz');
}
function quiz1(){quizPage(1)}
function quiz2(){quizPage(2)}
function checkQuiz(form){
  const which=Number(form.dataset.quiz),items=which===1?quizzes.q1:quizzes.q2;
  let score=0,allAnswered=true;
  items.forEach(item=>{
    const field=form.querySelector(`[data-qid="${item.id}"]`);
    const picked=field.querySelector(`input[name="${item.id}"]:checked`);
    const box=field.querySelector('.q-feedback');
    box.className='q-feedback show';
    if(!picked){allAnswered=false;box.classList.add('incorrect');box.innerHTML='<strong>Choose an answer.</strong> Select one option before checking your response.';return}
    const ok=picked.value===item.answer;
    if(ok){score++;box.classList.add('correct');box.innerHTML=`<strong>Nice!</strong> ${item.why}`}
    else{box.classList.add('incorrect');box.innerHTML=`<strong>Not quite.</strong> The best answer is <em>${item.answer}</em>. ${item.why}`}
  });
  document.getElementById('scoreText').textContent=allAnswered?`${score} of ${items.length} correct`:'Answer both questions';
  if(!allAnswered){showToast('Please answer both questions.');say('Please answer both questions.');return}
  const summary=document.getElementById('quizSummary');summary.className='quiz-summary show';summary.textContent=`You scored ${score} out of ${items.length}. This example allows you to continue after receiving feedback.`;
  if(which===1)state.quiz1Done=true;else state.quiz2Done=true;
  const next=which===1?3:5;unlock(next);
  let nav=form.querySelector('.quiz-next-row');
  if(!nav){nav=document.createElement('div');nav.className='nav-row right quiz-next-row';nav.innerHTML=`<button class="primary-btn" type="button" data-action="${which===1?'to-video2':'finish'}">${which===1?'Continue to Video 2':'Finish Example'} →</button>`;form.appendChild(nav)}
  showToast('Quiz feedback is ready.');say(`Quiz ${which} complete. You scored ${score} out of ${items.length}.`);
}
function complete(){
  main.innerHTML=shell(`<div class="content-card completion-box"><div class="big-check" aria-hidden="true">✓</div><h2>Example Complete</h2><p>Your coworker has now seen the full pattern: an embedded video, a two-question quiz with feedback, a second embedded video, and a second two-question quiz.</p><p>This can be swapped with real instructional content later without changing the basic interaction pattern.</p><div class="button-row center"><button class="secondary-btn" type="button" data-action="restart">Restart Example</button></div></div>`,'Complete');
}
menuToggle.addEventListener('click',e=>{e.stopPropagation();menu.classList.toggle('hidden');const hidden=menu.classList.contains('hidden');menuToggle.setAttribute('aria-expanded',hidden?'false':'true');menu.setAttribute('aria-hidden',hidden?'true':'false')});
document.addEventListener('click',e=>{if(!e.target.closest('#courseHud')){menu.classList.add('hidden');menuToggle.setAttribute('aria-expanded','false');menu.setAttribute('aria-hidden','true')}});
document.addEventListener('click',e=>{
  const jump=e.target.closest('[data-jump]');if(jump){go(Number(jump.dataset.jump));menu.classList.add('hidden');return}
  const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
  if(a==='start'){unlock(1);go(1)}
  else if(a==='to-quiz1'){unlock(2);go(2)}
  else if(a==='to-video2'){unlock(3);go(3)}
  else if(a==='to-quiz2'){unlock(4);go(4)}
  else if(a==='finish'){unlock(5);go(5)}
  else if(a==='back'){go(Math.max(0,state.current-1))}
  else if(a==='restart'){state.current=0;state.maxSection=0;state.quiz1Done=false;state.quiz2Done=false;go(0)}
});
document.addEventListener('submit',e=>{if(e.target.id==='quizForm'){e.preventDefault();checkQuiz(e.target)}});
renderMenu();welcome();
})();
</script>
</body>
</html>
